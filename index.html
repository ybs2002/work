<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리집 식단 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍚 우리집 식단 관리</h1>
    <!-- 탭 버튼: 누르면 아래 화면(section)이 바뀝니다 -->
    <nav>
      <button class="tab active" data-tab="plan">📅 주간 식단</button>
      <button class="tab" data-tab="menus">🍳 메뉴</button>
      <button class="tab" data-tab="family">👨‍👩‍👧 가족</button>
      <button class="tab" data-tab="shopping">🛒 장보기</button>
    </nav>
  </header>

  <main>
    <!-- 1. 주간 식단표 -->
    <section id="plan" class="page active">
      <h2>이번 주 식단표</h2>
      <p class="hint">칸을 눌러 메뉴를 고르세요. ⚠️ 표시는 가족 중 누군가 못 먹는 재료가 들어있다는 뜻이에요.</p>
      <div class="table-wrap">
        <table id="plan-table"></table>
      </div>
    </section>

    <!-- 2. 메뉴 관리 -->
    <section id="menus" class="page">
      <h2>메뉴 목록</h2>
      <form id="menu-form" class="card">
        <input id="menu-name" placeholder="메뉴 이름 (예: 김치찌개)" required>
        <input id="menu-ingredients" placeholder="재료를 쉼표로 구분 (예: 김치, 돼지고기, 두부)" required>
        <button type="submit">메뉴 추가</button>
      </form>
      <ul id="menu-list" class="list"></ul>
    </section>

    <!-- 3. 가족 관리 -->
    <section id="family" class="page">
      <h2>가족 구성원</h2>
      <form id="family-form" class="card">
        <input id="member-name" placeholder="이름 (예: 엄마)" required>
        <input id="member-avoid" placeholder="못 먹는 재료, 쉼표로 구분 (예: 새우, 땅콩)">
        <button type="submit">가족 추가</button>
      </form>
      <ul id="family-list" class="list"></ul>
    </section>

    <!-- 4. 장보기 목록 -->
    <section id="shopping" class="page">
      <h2>장보기 목록</h2>
      <p class="hint">이번 주 식단에 들어간 재료를 자동으로 모았어요. 산 재료는 체크하세요.</p>
      <ul id="shopping-list" class="list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
